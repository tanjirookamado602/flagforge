[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flagsmith-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Flagsmith feature flags and Bayesian experimentation"
readme = "README.md"
authors = [
    { name = "FlagForge Team" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
flagsmith-mcp = "flagsmith_mcp.server:main"

[tool.mcp]
server = "flagsmith_mcp.server:main"
